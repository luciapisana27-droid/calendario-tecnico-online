const $=s=>document.querySelector(s);const key='calendario-ufficio-tecnico-funzionale-v11';const states=['Confermato','In attesa','Da coprire'];const spaces0=['Teatro Verga','Ridotto Verga','Scuola Platamone','Palazzo Platamone','Città e attività diffuse','Tournée e fuori sede','Altri spazi e progetti'];const roles0=['Tecnico','Luci','Illuminotecnico','Audio','Macchinista','Video','Attrezzista','Custode','Direttore di scena','Capo settore luci','Capo settore audio','Capo settore macchinisti','Capo settore video','Capo settore attrezzeria','Capo settore costruzioni e scenografia','Altro'];const names=['Filippo Tornetta','Gregorio Calderone','Lorenzo Noe','Giuseppe Noe','Gravina Marco','Pulvirenti Angelo','Di Franco Elio','Roberta Cannavo','Lucia Pisana','Agnese Failla','Sebastiano Grigoli','Salvo Costa','Alessandro Mangano','Salvatore Melarosa','Luigi Galatioto','Giuseppe Melarosa','Andrea Giardinieri'];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random();const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const pd=s=>new Date(s+'T12:00:00');const plus=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};const monday=d=>plus(d,-((d.getDay()+6)%7));const norm=x=>String(x||'').trim().toLowerCase();
function starter(){return{pin:'1234',spaces:[...spaces0],roles:[...roles0],tech:names.map((name,i)=>({id:'t'+i,name,roles:['Tecnico'],contact:''})),vehicles:[{id:'v1',name:'Furgone',notes:''}],moves:[],shifts:[],shows:[],equipmentEvents:[]}}let db;try{let cached=JSON.parse(localStorage.getItem(key));db=cached&&cached.tech?cached:starter()}catch{db=starter()}for(const k of ['spaces','roles','tech','vehicles','moves','shifts','shows','equipmentEvents'])if(!Array.isArray(db[k]))db[k]=starter()[k];if(!db.pin)db.pin='1234';db.shifts.forEach(s=>{if(!Array.isArray(s.slots))s.slots=[{start:s.start||'09:00',end:s.end||'13:00'}];if(!Array.isArray(s.roles))s.roles=[s.role||'Tecnico'];if(!Array.isArray(s.tech))s.tech=[];if(typeof s.equipment!=='string')s.equipment='';if(typeof s.van!=='boolean')s.van=false});db.shows.forEach(sh=>{if(!Array.isArray(sh.spaces))sh.spaces=[sh.space||''];if(typeof sh.time!=='string')sh.time='';if(typeof sh.equipment!=='string')sh.equipment='';if(typeof sh.notes!=='string')sh.notes='';if(typeof sh.driveLink!=='string')sh.driveLink=''});let page='calendar',date=new Date(),unlocked=false;const SUPABASE_URL='https://ohmofthdkjkttdyjuxwv.supabase.co',SUPABASE_KEY='sb_publishable_KXaMggWSjqvWXGYqgxNjsQ_7R4cWh_z',SUPABASE_TABLE='data',SUPABASE_ROW_ID=1;let remoteReady=false,savingRemote=false;const cache=()=>localStorage.setItem(key,JSON.stringify(db));const save=()=>{cache();pushRemote()};async function pushRemote(){if(!remoteReady||savingRemote)return;try{savingRemote=true;let r=await fetch(SUPABASE_URL+'/rest/v1/'+SUPABASE_TABLE+'?id=eq.'+SUPABASE_ROW_ID,{method:'PATCH',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({content:db})});if(!r.ok)throw Error(await r.text());setStatus('☁️ Salvato online')}catch(e){console.warn(e);setStatus('⚠️ Connessione Supabase non riuscita')}finally{savingRemote=false}}async function pullRemote(){try{let r=await fetch(SUPABASE_URL+'/rest/v1/'+SUPABASE_TABLE+'?id=eq.'+SUPABASE_ROW_ID+'&select=content',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});if(!r.ok)throw Error(await r.text());let rows=await r.json(),remote=rows[0]&&rows[0].content;if(remote&&remote.tech){db=remote;cache()}remoteReady=true;if(!remote||!remote.tech)await pushRemote();render();setStatus('☁️ Sincronizzato')}catch(e){console.warn(e);setStatus('⚠️ Connessione Supabase non riuscita')}}function setStatus(t){let x=document.getElementById('syncStatus');if(x)x.textContent=t}const toast=t=>{let e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(window._tt);window._tt=setTimeout(()=>e.classList.add('hidden'),3500)};const modal=(t,b)=>{$('#modalTitle').textContent=t;$('#modalBody').innerHTML=b;$('#modal').classList.add('show')};const close=()=>$('#modal').classList.remove('show');const tname=id=>db.tech.find(x=>x.id===id)?.name||'';const vname=id=>db.vehicles.find(x=>x.id===id)?.name||'';const roleText=a=>a.join(', ');const slotText=s=>s.slots.map(x=>x.start+'–'+x.end+(x.end<=x.start?' (+1g)':'')).join(' · ');const hours=s=>s.slots.reduce((n,x)=>{let a=new Date(s.date+'T'+x.start),b=new Date(s.date+'T'+x.end);if(b<=a)b.setDate(b.getDate()+1);return n+(b-a)/36e5},0);const need=s=>Math.max(0,(+s.need||1)-s.tech.length);const needsEquipment=s=>s.equipment.split('\n').map(x=>x.trim()).filter(Boolean);const allSpaces=()=>[...new Set([...db.spaces,...db.shifts.map(s=>s.space)].filter(Boolean))];const can=()=>{if(!unlocked){toast('Prima premi “Sblocca con PIN”.');return false}return true};
function select(el,vals,label){let old=el.value;el.innerHTML='<option value="">'+label+'</option>'+vals.map(x=>'<option>'+esc(x)+'</option>').join('');el.value=vals.includes(old)?old:''}function current(){let start=fmt(monday(date)),end=fmt(plus(monday(date),6)),q=$('#search').value.toLowerCase(),sp=$('#filterSpace').value,ro=$('#filterRole').value,st=$('#filterStatus').value;return db.shifts.filter(s=>s.date>=start&&s.date<=end&&(!sp||s.space===sp)&&(!ro||s.roles.includes(ro))&&(!st||s.status===st)&&(!q||[s.title,s.space,s.equipment,s.roles.join(' '),...s.tech.map(tname)].join(' ').toLowerCase().includes(q)))}function moves(){let a=fmt(monday(date)),b=fmt(plus(monday(date),6));return db.moves.filter(m=>m.date>=a&&m.date<=b)}
function render(){select($('#filterSpace'),allSpaces(),'Tutti gli spazi');select($('#filterRole'),db.roles,'Tutte le mansioni');$('#title').textContent={calendar:'Calendario turni',shows:'Spettacoli',tech:'Squadra tecnica',van:'Furgone: movimenti',equipment:'Attrezzatura per spazio',equipmentEvents:'Eventi attrezzatura',settings:'Impostazioni'}[page];$('#calendarControls').classList.toggle('hidden',!['calendar','van','equipment'].includes(page));$('#newShift').classList.toggle('hidden',!unlocked);$('#mode').textContent=unlocked?'✏️ Modalità modifica attiva':'🔒 Sola consultazione';$('#mode').className='badge '+(unlocked?'edit':'');$('#unlock').classList.toggle('hidden',unlocked);$('#lock').classList.toggle('hidden',!unlocked);document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));let ss=current(),mm=moves();$('#range').textContent=monday(date).toLocaleDateString('it-IT',{day:'numeric',month:'short'})+' – '+plus(monday(date),6).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});$('#stats').innerHTML=[['Turni nel periodo',ss.length],['Movimenti furgone',mm.length],['Turni da coprire',ss.filter(s=>need(s)||s.status==='Da coprire').length],['Ore pianificate',ss.reduce((n,s)=>n+hours(s)*s.tech.length,0).toLocaleString('it-IT')]].map(x=>'<div class="stat"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('');if(page==='calendar')calendar(ss,mm);if(page==='shows')showsPage();if(page==='tech')technicians();if(page==='van')van(mm,ss);if(page==='equipment')equipment(ss);if(page==='settings')settings()}
function shiftCard(s){let c=s.status==='In attesa'?'wait':s.status==='Da coprire'||need(s)?'open':'';return'<button class="card '+c+'" data-open-shift="'+s.id+'"><b>'+s.slots.map(x=>esc(x.start+'–'+x.end)).join('<br>')+'</b>'+esc(s.title)+(s.equipment?' 🧰':'')+(s.van?' 🚐':'')+'</button>'}function moveCard(m){return'<button class="card van" data-open-move="'+m.id+'"><b>🚐 '+esc(m.start+'–'+m.end)+'</b>'+esc(m.from||'?')+' → '+esc(m.to)+'</button>'}
function calendar(ss,mm){let days=Array.from({length:7},(_,i)=>plus(monday(date),i)),showsThisWeek=db.shows.filter(s=>s.date>=fmt(monday(date))&&s.date<=fmt(plus(monday(date),6))),rows=[...db.tech.map(t=>({type:'tech',id:t.id,name:t.name,sub:roleText(t.roles)})),{type:'none',id:'none',name:'Da assegnare',sub:'Turni senza tecnico'}],h='<div class="scroll"><div class="grid"><div class="weekhead"><div>⚓</div>'+days.map((d,i)=>'<div><span class="coord">'+String.fromCharCode(65+i)+'</span>'+d.toLocaleDateString('it-IT',{weekday:'short'})+'<strong>'+d.getDate()+'</strong></div>').join('')+'</div>';let n=0;for(const r of rows){n++;h+='<div class="weekrow"><div class="label"><span class="number">'+n+'</span><div><b>'+esc(r.name)+'</b><small>'+esc(r.sub)+'</small></div></div>'+days.map((day,i)=>{let dayS=fmt(day),a=r.type==='van'?[]:ss.filter(s=>s.date===dayS&&(r.type==='none'?!s.tech.length:s.tech.includes(r.id)));return'<div class="cell" data-cell-date="'+dayS+'" data-cell-type="'+r.type+'" data-cell-id="'+r.id+'"><span class="ref">'+String.fromCharCode(65+i)+n+'</span>'+a.map(s=>{let c=s.status==='In attesa'?'wait':s.status==='Da coprire'||need(s)?'open':'';return'<button class="card '+c+'" data-view-shift="'+s.id+'"><b>'+s.slots.map(x=>esc(x.start+'–'+x.end)).join('<br>')+'</b>'+esc(s.title)+(s.equipment?' 🧰':'')+(s.van?' 🚐':'')+'</button>'}).join('')+'</div>'}).join('')+'</div>'}h+='<div class="section show">🎭 PROGRAMMA SPETTACOLI — calendario programmazione (non turni tecnici)</div>';h+='<div class="weekrow"><div class="label"><span class="number">🎭</span><div><b>Spettacoli in programma</b><small>Programma spettacoli · non turni tecnici</small></div></div>'+days.map((day,i)=>{let dayS=fmt(day),dayShows=showsThisWeek.filter(sh=>sh.date===dayS);return'<div class="cell" data-cell-date="'+dayS+'" data-cell-type="show" data-cell-id="shows"><span class="ref">'+String.fromCharCode(65+i)+'S</span>'+dayShows.map(sh=>'<button class="card show" data-view-show="'+sh.id+'"><b>'+(sh <script>
/* Collegamento Supabase e indicatore di sincronizzazione */
(function () {
  const SUPABASE_URL = 'https://ohmofthdkjkttdyjuxwv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_KXaMggWSjqvWXGYqgxNjsQ_7R4cWh_z';
  const TABLE = 'data';
  const ROW_ID = 1;

  function badge(testo) {
    const top = document.querySelector('.mode');
    if (!top) return;
    let b = document.getElementById('syncStatus');
    if (!b) {
      b = document.createElement('span');
      b.id = 'syncStatus';
      b.className = 'badge';
      top.appendChild(b);
    }
    b.textContent = testo;
  }

  async function carica() {
    badge('☁️ Connessione…');
    try {
      const risposta = await fetch(
        SUPABASE_URL + '/rest/v1/' + TABLE + '?id=eq.' + ROW_ID + '&select=content',
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: 'Bearer ' + SUPABASE_KEY
          }
        }
      );

      if (!risposta.ok) throw new Error('Errore Supabase');

      const righe = await risposta.json();
      if (righe[0] && righe[0].content) {
        localStorage.setItem('calendario-ufficio-tecnico-funzionale-v1', JSON.stringify(righe[0].content));
      }

      badge('☁️ Sincronizzato');
    } catch (errore) {
      console.error(errore);
      badge('⚠️ Supabase non connesso');
    }
  }

  function aggiungiMenuAttrezzatura() {
    const nav = document.querySelector('nav');
    if (!nav || document.getElementById('menuEventiAttrezzatura')) return;

    const voce = document.createElement('button');
    voce.id = 'menuEventiAttrezzatura';
    voce.type = 'button';
    voce.textContent = '🧰 Eventi attrezzatura';

    voce.addEventListener('click', function () {
      alert('Gli eventi Attrezzatura sono nella riga dedicata del calendario, prima del Furgone. Per inserirne uno: sblocca il calendario con PIN e clicca nella cella della riga Attrezzatura.');
    });

    nav.appendChild(voce);
  }

  window.addEventListener('load', function () {
    aggiungiMenuAttrezzatura();
    carica();
  });
})();
</script>
